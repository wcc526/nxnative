name: Encrypted Yakuza build
on:
  workflow_dispatch:
    inputs:
      input_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sealed-yakuza
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install trusted build tooling
        run: |
          python -m pip install --only-binary=:all: cryptography==50.0.2
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
      - name: Download encrypted input
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download cloud-input-yakuza40-public-20261026 --pattern build-input.enc --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
      - name: Compile with encrypted diagnostics
        env:
          BUILD_KEY: ${{ secrets.YAKUZA_BUILD_KEY_20261026 }}
          INPUT_SHA: ${{ inputs.input_sha256 }}
        run: python scripts/sealed_build.py "$RUNNER_TEMP/build-input.enc" "$INPUT_SHA"
      - name: Retain encrypted result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-result
          path: ${{ runner.temp }}/build-output.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
